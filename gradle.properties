# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Keep local builds within a predictable memory budget. The Kotlin compiler runs
# in a separate process, so cap it independently instead of inheriting this heap.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
# Prefer releasing memory when a command finishes over keeping a warm daemon.
org.gradle.daemon=false
org.gradle.configuration-cache=true
# Builds use the JDK selected by JAVA_HOME/the IDE and must not download another
# JDK into GRADLE_USER_HOME behind the user's back.
org.gradle.java.installations.auto-download=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
kotlin.incremental=true
android.disallowKotlinSourceSets=false

# OAuth App client ID for the Operation-Grimoire "Grimoire" GitHub OAuth App.
# Used by the in-app device-flow auth so users can install extensions from
# their own private GitHub repositories. Public value (not a secret).
GITHUB_OAUTH_CLIENT_ID=Ov23lid5PgnoZ2i1x778
