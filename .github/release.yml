# Config consumed by GitHub's /generate-notes API when the release workflows
# auto-generate release bodies. Categorisation is driven by PR labels; PRs that
# don't carry any listed label fall into "Other changes" via the "*" catch-all.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug fixes
      labels:
        - bug
        - fix
    - title: Sources
      labels:
        - source
        - extension
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
