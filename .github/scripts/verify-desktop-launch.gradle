// Inspect Compose's final run task after all plugin configuration. This check
// catches arguments being overwritten even when the application DSL looks right.
// Run with --no-configuration-cache: this is a verification init script only.
gradle.projectsEvaluated {
    def desktop = gradle.rootProject.project(':desktop')
    def expected = []
    ['desktopManifest': '--extension', 'desktopData': '--data'].each { property, flag ->
        if (desktop.hasProperty(property)) {
            expected += [flag, desktop.rootProject.file(desktop.property(property)).absolutePath]
        }
    }
    def actual = desktop.tasks.named('run').get().args
    assert actual == expected : "Desktop run arguments: expected ${expected}, got ${actual}"
    println('Verified desktop run arguments: ' + actual)
}
