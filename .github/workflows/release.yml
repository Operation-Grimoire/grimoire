name: Build & Release App

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Must be vX.Y.Z.'
        required: true

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NAME="$REQUESTED_TAG"
          if ! echo "$NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$NAME' is not vX.Y.Z" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create git tag if missing
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists locally."
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; fetching."
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            echo "Creating and pushing tag $TAG at ${{ github.sha }}."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG" "${{ github.sha }}"
            git push origin "refs/tags/$TAG"
          fi

      - name: Build the requested tag and its Android stable notes
        id: source
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout --detach "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p build/android-release
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > build/android-release/catalog.json
          python .github/scripts/release_policy.py plan --platform android --channel stable --exclude-tag "$TAG" --catalog build/android-release/catalog.json --notes build/android-release/notes.md

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --build-cache
        env:
          APP_VERSION_TAG: ${{ steps.tag.outputs.name }}
          APP_GIT_SHA: ${{ steps.source.outputs.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Aptabase app key is non-sensitive (shipped in every APK) → repo variable.
          APTABASE_APP_KEY: ${{ vars.APTABASE_APP_KEY }}

      - name: Sign APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/grimoire.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Compute APK sha256
        run: |
          cd app/build/outputs/apk/release
          sha256sum grimoire.apk | awk '{print $1}' > grimoire.apk.sha256
          echo "Published digest: $(cat grimoire.apk.sha256)"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Grimoire ${{ steps.tag.outputs.name }}
          prerelease: false
          make_latest: 'true'
          body_path: build/android-release/notes.md
          files: |
            app/build/outputs/apk/release/grimoire.apk
            app/build/outputs/apk/release/grimoire.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
