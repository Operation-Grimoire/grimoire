name: Nightly Beta Build

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: 'Build an Android beta even without pending Android runtime changes'
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Plan from last complete published Android release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: |
          mkdir -p build/android-release
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > build/android-release/catalog.json
          EXTRA=()
          if [ "$FORCE" = true ]; then EXTRA+=(--force); fi
          python .github/scripts/release_policy.py plan --platform android --channel beta --catalog build/android-release/catalog.json --notes build/android-release/notes.md "${EXTRA[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-beta-notes
          path: build/android-release/notes.md
          if-no-files-found: error
  beta:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: android-beta-notes
          path: build/android-release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compute beta version
        id: ver
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=v:refname \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | tail -n1)
          LATEST=${LATEST:-v0.0.0}
          SHORT=$(git rev-parse --short HEAD)
          RUN=${{ github.run_number }}
          TAG="${LATEST}-beta.${RUN}"
          VERSION_NAME="${LATEST#v}-beta.${RUN}+${SHORT}"
          echo "base_tag=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "beta_number=${RUN}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --build-cache
        env:
          APP_VERSION_TAG: ${{ steps.ver.outputs.base_tag }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          APP_BETA_NUMBER: ${{ steps.ver.outputs.beta_number }}
          APP_GIT_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Aptabase app key is non-sensitive (shipped in every APK) → repo variable.
          APTABASE_APP_KEY: ${{ vars.APTABASE_APP_KEY }}

      - name: Sign APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/grimoire.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Compute APK sha256
        run: |
          cd app/build/outputs/apk/release
          sha256sum grimoire.apk | awk '{print $1}' > grimoire.apk.sha256
          echo "Published digest: $(cat grimoire.apk.sha256)"

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Grimoire ${{ steps.ver.outputs.version_name }}
          prerelease: true
          make_latest: 'false'
          target_commitish: ${{ github.sha }}
          body_path: build/android-release/notes.md
          files: |
            app/build/outputs/apk/release/grimoire.apk
            app/build/outputs/apk/release/grimoire.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old beta releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep the newest 10 plus explicit migration baselines. Never prune
          # the signed DB32 baseline while its upgrade harness is maintained.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > build/android-release/prune-catalog.json
          OLD=$(python .github/scripts/release_policy.py prune --catalog build/android-release/prune-catalog.json)
          if [ -z "$OLD" ]; then
            echo "No old beta releases to prune."
            exit 0
          fi
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting $TAG"
            gh release delete "$TAG" --cleanup-tag --yes \
              --repo "${{ github.repository }}"
          done <<< "$OLD"
