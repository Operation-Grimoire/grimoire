name: Nightly Beta Build

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute beta version
        id: ver
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -Ev -- '-beta\.' | head -n1)
          LATEST=${LATEST:-v0.0.0}
          SHORT=$(git rev-parse --short HEAD)
          RUN=${{ github.run_number }}
          TAG="${LATEST}-beta.${RUN}"
          VERSION_NAME="${LATEST#v}-beta.${RUN}+${SHORT}"
          echo "base_tag=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "beta_number=${RUN}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --build-cache
        env:
          APP_VERSION_TAG: ${{ steps.ver.outputs.base_tag }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          APP_BETA_NUMBER: ${{ steps.ver.outputs.beta_number }}
          APP_GIT_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/grimoire.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Compute APK sha256
        run: |
          cd app/build/outputs/apk/release
          sha256sum grimoire.apk | awk '{print $1}' > grimoire.apk.sha256
          echo "Published digest: $(cat grimoire.apk.sha256)"

      - name: Generate beta release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          BASE_TAG: ${{ steps.ver.outputs.base_tag }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # Each nightly publishes its own versioned prerelease so the app can
          # aggregate stored bodies on upgrade (matching the stable flow).
          # /generate-notes diffs the new tag against the previous beta tag
          # (or last stable if no prior beta exists), giving a categorised PR
          # list per .github/release.yml.
          PREV=$(gh release list --limit 50 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v.+-beta\\..+")))]
                  | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          PREV=${PREV:-$BASE_TAG}
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f "tag_name=$TAG" \
            -f "target_commitish=$SHA" \
            -f "previous_tag_name=$PREV" \
            --jq .body)
          {
            echo 'body<<RELNOTES_EOF'
            printf 'Auto-built from `master` @ %s.\n\n' "$SHA"
            printf 'Version: `%s`\n\n' "$VERSION_NAME"
            printf '%s\n' "$NOTES"
            echo RELNOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Grimoire ${{ steps.ver.outputs.version_name }}
          prerelease: true
          make_latest: 'false'
          target_commitish: ${{ github.sha }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            app/build/outputs/apk/release/grimoire.apk
            app/build/outputs/apk/release/grimoire.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old beta releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep the most recent 10 beta releases; delete older ones along
          # with their git tags. Caps storage and matches the checker's
          # MAX_AGGREGATED_RELEASES = 10.
          OLD=$(gh release list --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v.+-beta\\..+")))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName')
          if [ -z "$OLD" ]; then
            echo "No old beta releases to prune."
            exit 0
          fi
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting $TAG"
            gh release delete "$TAG" --cleanup-tag --yes \
              --repo "${{ github.repository }}"
          done <<< "$OLD"
