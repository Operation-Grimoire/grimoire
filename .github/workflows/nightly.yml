name: Nightly Beta Build

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute beta version
        id: ver
        run: |
          LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          LATEST=${LATEST:-v0.0.0}
          SHORT=$(git rev-parse --short HEAD)
          RUN=${{ github.run_number }}
          VERSION_NAME="${LATEST#v}-beta.${RUN}+${SHORT}"
          echo "base_tag=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "beta_number=${RUN}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --build-cache
        env:
          APP_VERSION_TAG: ${{ steps.ver.outputs.base_tag }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          APP_BETA_NUMBER: ${{ steps.ver.outputs.beta_number }}
          APP_GIT_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/grimoire.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Compute APK sha256
        run: |
          cd app/build/outputs/apk/release
          sha256sum grimoire.apk | awk '{print $1}' > grimoire.apk.sha256
          echo "Published digest: $(cat grimoire.apk.sha256)"

      - name: Generate beta release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          set -euo pipefail
          # The beta tag is rolling. GitHub's /generate-notes can't diff a tag
          # against itself (it resolves both ends to the same existing commit),
          # so we capture the previous beta commit before the release step
          # overwrites it and use `git log` directly. fetch-depth: 0 above
          # ensures the full history is available.
          PREV_SHA=$(gh api "repos/${{ github.repository }}/releases/tags/beta" \
            --jq .target_commitish 2>/dev/null || true)
          CHANGES=""
          if [ -n "$PREV_SHA" ] && git cat-file -e "$PREV_SHA" 2>/dev/null; then
            CHANGES=$(git log --no-merges --pretty=format:'- %s' "$PREV_SHA..$SHA" || true)
          fi
          {
            echo 'body<<RELNOTES_EOF'
            printf 'Auto-built from `master` @ %s.\n\n' "$SHA"
            printf 'Version: `%s`\n\n' "$VERSION_NAME"
            if [ -n "$CHANGES" ]; then
              printf '## Changes since previous beta\n\n'
              printf '%s\n\n' "$CHANGES"
            fi
            printf 'This is a rolling beta release. Each push to `master` replaces it with a fresh build.\n'
            echo RELNOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish/refresh beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Grimoire ${{ steps.ver.outputs.version_name }}
          prerelease: true
          make_latest: 'false'
          target_commitish: ${{ github.sha }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            app/build/outputs/apk/release/grimoire.apk
            app/build/outputs/apk/release/grimoire.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
