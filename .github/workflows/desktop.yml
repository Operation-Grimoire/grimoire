name: Desktop reading slice

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  packages: read

jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Operation-Grimoire/grimoire-extensions
          ref: 69b008be343e8cbec9287ef57f8505430a648494
          path: .desktop-fixtures
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unchanged Royal Road source as a JAR
        shell: bash
        run: bash ./gradlew -p .desktop-fixtures/jvm jarEnRoyalroad --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bind trusted fixture artifact
        shell: bash
        run: >-
          python desktop/tools/local_manifest.py
          --jar .desktop-fixtures/jvm/build/extensions/en-royalroad/io.grimoire.extension.en.royalroad-1.0.4.jar
          --output desktop/build/royalroad.properties
      - name: Shared, desktop and packaged-source journey checks
        shell: bash
        run: >-
          bash ./gradlew :reading-core:test :desktop:test :desktop:integrationTest
          -PdesktopFixturesRepo=.desktop-fixtures -PdesktopTestManifest=desktop/build/royalroad.properties --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose UI fixture journey
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then PREFIX="xvfb-run -a"; else PREFIX=""; fi
          $PREFIX bash ./gradlew :desktop:uiTest -PdesktopFixturesRepo=.desktop-fixtures -PdesktopTestManifest=desktop/build/royalroad.properties --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            reading-core/build/test-results/
            desktop/build/test-results/
            desktop/build/reports/tests/
            desktop/build/royalroad.properties
            desktop/build/ui-evidence/
