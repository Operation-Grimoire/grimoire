name: Desktop reading slice

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  packages: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    uses: ./.github/workflows/platform-impact.yml
  release-preview:
    needs: impact
    if: github.event_name == 'push' && needs.impact.outputs.desktop_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Preview desktop stream without publishing installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/desktop-release
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > build/desktop-release/catalog.json
          python .github/scripts/release_policy.py plan --platform desktop --channel beta --catalog build/desktop-release/catalog.json --notes build/desktop-release/notes.md > build/desktop-release/plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-preview
          path: |
            build/desktop-release/notes.md
            build/desktop-release/plan.txt
          if-no-files-found: error
  macos-storage:
    needs: impact
    if: always() && (needs.impact.result != 'success' || needs.impact.outputs.desktop_ci == 'true')
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      APP_VERSION_TAG: v0.0.0
      APP_BETA_NUMBER: ${{ github.run_number }}
      APP_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require successful release policy
        if: needs.impact.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared contracts and native SQLite storage tests
        run: bash ./gradlew :reading-core:test :desktop:test --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-macos-storage
          path: |
            reading-core/build/test-results/
            desktop/build/test-results/
            desktop/build/reports/tests/
  desktop-browser:
    # Real embedded Chromium (JCEF): sign-in, shared cookies, restart and bounded shutdown.
    needs: impact
    if: always() && (needs.impact.result != 'success' || needs.impact.outputs.desktop_ci == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows, args: '' }
          - { os: macos-latest, label: macos, args: '' }
          - { os: macos-latest, label: macos-2, args: '' }
          - { os: macos-latest, label: macos-3, args: '' }
    name: desktop-browser (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      APP_VERSION_TAG: v0.0.0
      APP_BETA_NUMBER: ${{ github.run_number }}
      APP_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JCEF_EXTRA_ARGS: ${{ matrix.args }}
    steps:
      - name: Require successful release policy
        if: needs.impact.result != 'success'
        shell: bash
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the downloaded browser engine
        uses: actions/cache@v4
        with:
          path: desktop/build/browser-check/browser/engine-jcef-152.0.6
          key: jcef-152.0.6-${{ runner.os }}-${{ runner.arch }}
      - name: Sign in, share cookies and shut down
        timeout-minutes: 8
        shell: bash
        run: bash ./gradlew :desktop:browserCheck -PbrowserPhase=session --console=plain
      - name: Restart with the same profile
        timeout-minutes: 5
        shell: bash
        run: bash ./gradlew :desktop:browserCheck -PbrowserPhase=restart --console=plain
      - name: Recover after terminating the browser helper
        timeout-minutes: 5
        shell: bash
        run: bash ./gradlew :desktop:browserCheck -PbrowserPhase=recovery --console=plain
      - name: No browser processes left behind (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $left = @(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'jcef_helper.exe' -or
              ($_.Name -eq 'java.exe' -and $_.CommandLine -like '*-Dgrimoire.browser.helper=true*')
          })
          Write-Host "Leftover browser processes: $($left.Count)"
          if ($left.Count -ne 0) { exit 1 }
      - name: No browser processes left behind (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          left=$(ps -axo command | grep -Eic '[j]cef|[g]rimoire\.browser\.helper=true' || true)
          echo "Leftover browser processes: $left"
          test "$left" -eq 0
      - name: Print browser crash stack
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          for report in desktop/build/browser-check/browser/hs_err_pid*.log; do
            if [ -f "$report" ]; then
              awk '/^Current thread / { stack=1 } stack && /^(siginfo:|Registers:)/ { exit } stack { print }' "$report"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-browser-${{ matrix.label }}
          path: desktop/build/browser-check/browser/profile/cef.log
          if-no-files-found: ignore
  desktop:
    needs: impact
    if: always() && (needs.impact.result != 'success' || needs.impact.outputs.desktop_ci == 'true')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      APP_VERSION_TAG: v0.0.0
      APP_BETA_NUMBER: ${{ github.run_number }}
      APP_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require successful release policy
        if: needs.impact.result != 'success'
        shell: bash
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared, desktop and source-neutral app journeys
        shell: bash
        run: bash ./gradlew :reading-core:test :desktop:test :desktop:integrationTest --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose UI app journey
        # A normal run takes about 3 minutes. The watchdog dumps the test worker's threads
        # while it is still alive; the step timeout is only a backstop.
        timeout-minutes: 12
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then PREFIX="xvfb-run -a"; else PREFIX=""; fi
          $PREFIX bash ./gradlew :desktop:uiTest --console=plain &
          run=$!
          for _ in $(seq 540); do
            if ! kill -0 "$run" 2>/dev/null; then wait "$run"; exit $?; fi
            sleep 1
          done
          echo "::error::UI tests still running after 9 minutes; dumping test worker threads"
          for pid in $(jps -l | awk '/GradleWorkerMain/ { print $1 }'); do jcmd "$pid" Thread.print || true; done
          kill "$run" || true
          bash ./gradlew --stop || true
          exit 1
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out the external compatibility fixture
        uses: actions/checkout@v4
        with:
          repository: Operation-Grimoire/grimoire-extensions
          ref: 69b008be343e8cbec9287ef57f8505430a648494
          path: .desktop-fixtures
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build real packaged extension for compatibility smoke
        shell: bash
        run: bash ./gradlew -p .desktop-fixtures/jvm jarEnRoyalroad --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bind trusted compatibility artifact
        shell: bash
        run: |
          python -m unittest discover -s desktop/tools -p 'test_*.py'
          python desktop/tools/local_manifest.py --jar .desktop-fixtures/jvm/build/extensions/en-royalroad/io.grimoire.extension.en.royalroad-1.0.4.jar --output desktop/build/royalroad.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify normal launch task receives manifest and data arguments
        shell: bash
        run: >-
          bash ./gradlew :desktop:help -I .github/scripts/verify-desktop-launch.gradle
          -PdesktopManifest=desktop/build/royalroad.properties '-PdesktopData=desktop/build/launch check'
          --no-configuration-cache --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Packaged-extension compatibility smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then PREFIX="xvfb-run -a"; else PREFIX=""; fi
          $PREFIX bash ./gradlew :desktop:extensionCompatibilityTest -PdesktopFixturesRepo=.desktop-fixtures -PdesktopTestManifest=desktop/build/royalroad.properties --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            reading-core/build/test-results/
            desktop/build/test-results/
            desktop/build/reports/tests/
            desktop/build/royalroad.properties
            desktop/build/libs/*reader-fixture.jar
            desktop/build/ui-evidence/
            desktop/build/compatibility-evidence/
