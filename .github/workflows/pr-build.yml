name: PR Build (dry-run)

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/platform-impact.yml
  build:
    needs: impact
    if: always() && (needs.impact.result != 'success' || needs.impact.outputs.android_ci == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Require successful release policy
        if: needs.impact.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Assemble debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --build-cache --stacktrace
        env:
          # Avoids `versionCode = 0` since PR builds don't fetch tags.
          APP_VERSION_TAG: v0.0.0
          APP_BETA_NUMBER: ${{ github.run_number }}
          APP_GIT_SHA: ${{ github.event.pull_request.head.sha }}
          ORG_GRADLE_PROJECT_extensionsApiVersion: 1.6.0-SNAPSHOT
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
